[project]
name = "guardrails-mcp"
version = "0.1.1"
description = "Small, evidence-first prompt regression tracker with MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tracy Anne Griffin Manning"}]
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "openai>=2,<3", "pydantic>=2,<3", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dashboard = ["gradio>=5,<7"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1", "sqlalchemy>=2,<3"]
[project.urls]
Repository = "https://github.com/TAM-DS/guardrails-mcp"
Issues = "https://github.com/TAM-DS/guardrails-mcp/issues"
[project.scripts]
guardrails = "guardrails_mcp.cli:main"
guardrails-mcp = "guardrails_mcp.server:main"
guardrails-dashboard = "guardrails_mcp.dashboard:main"
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["guardrails_mcp*"]
[tool.setuptools.package-data]
guardrails_mcp = ["data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
